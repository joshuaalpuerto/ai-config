version: "1"

PreToolUse:
  # Source: Contributor Blocker #1 — hooks.yaml path patterns silently fail if wrong form used
  - match:
      tools: ["Edit", "Write"]
      paths: ["hooks.yaml"]
    action:
      inject: "./docs/hooks.md"

  # Source: Contributor Blocker #2 — src/ frontmatter must match JSON Schema
  - match:
      tools: ["Edit", "Write"]
      paths: ["**/src/**/*.md"]
    action:
      inject_inline: |
        ## Source file frontmatter contract
        - Every src/ markdown file requires YAML frontmatter validated against schemas/*.schema.json
        - Required fields vary by type: agents need `name` + `description`; commands need `name` + `description`; rules need `description`; skills need `name` + `description`
        - `tools` and `allowed-tools` accept either a YAML list or a space-separated string
        - Platform overrides go under `overrides.<platform>:` with the same fields (minus overrides itself)
        - Run `aicfg validate` after editing to catch schema violations before build

  # Source: Complexity Trap #1 — hooks engine evaluation semantics
  - match:
      tools: ["Edit", "Write"]
      paths: ["**/internal/hooks/engine.go", "**/internal/hooks/loader.go", "**/internal/hooks/models.go"]
    action:
      inject: "./docs/hooks.md"

PostToolUse:
  # Source: Lint detection — Go vet for all Go source files
  - match:
      tools: ["Write", "Edit"]
      paths: ["*.go"]
    action:
      run_inline: "go vet ./..."
